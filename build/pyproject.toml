[project]
name = "pytch-doom"
version = "0.1.0"
description = ""
authors = [
    {name = "Ben North",email = "ben@redfrontdoor.org"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow (>=12.1.0,<13.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "omgifol (==0.5.1)",
    "colorlog (>=6.12.0,<7.0.0)"
]


[tool.poetry]
package-mode = false


[tool.isort]
profile = "black"
combine_as_imports = true
src_paths = ["."]
# Pytch-program fragments, spliced together by mk_pytch_code.py:
extend_skip = ["pytchdoom"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
